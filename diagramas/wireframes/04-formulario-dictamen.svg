<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="375" height="812" fill="#ffffff"/>
  <rect width="375" height="24" fill="#eeeeee"/>

  <rect x="0" y="24" width="375" height="56" fill="#2c3e50"/>
  <text x="48" y="52" font-size="14" fill="#ffffff" font-weight="bold">Dictamen técnico</text>
  <text x="48" y="70" font-size="10" fill="#bdc3c7">SUA 04821-2026</text>
  <text x="20" y="58" font-size="16" fill="#ffffff">←</text>

  <!-- offline indicator -->
  <rect x="290" y="36" width="65" height="20" rx="10" fill="#c0392b"/>
  <text x="322" y="50" font-size="8" fill="#fff" text-anchor="middle">SIN SEÑAL</text>

  <!-- step indicator (3 steps) -->
  <circle cx="70" cy="105" r="11" fill="#2c3e50"/>
  <text x="70" y="109" font-size="10" fill="#fff" text-anchor="middle">1</text>
  <text x="70" y="128" font-size="8" fill="#2c3e50" text-anchor="middle">Ejemplar</text>
  <line x1="90" y1="105" x2="165" y2="105" stroke="#ccc" stroke-width="2"/>
  <circle cx="187" cy="105" r="11" fill="#ddd"/>
  <text x="187" y="109" font-size="10" fill="#777" text-anchor="middle">2</text>
  <text x="187" y="128" font-size="8" fill="#999" text-anchor="middle">Intervención</text>
  <line x1="207" y1="105" x2="282" y2="105" stroke="#ccc" stroke-width="2"/>
  <circle cx="304" cy="105" r="11" fill="#ddd"/>
  <text x="304" y="109" font-size="10" fill="#777" text-anchor="middle">3</text>
  <text x="304" y="128" font-size="8" fill="#999" text-anchor="middle">Firmar</text>

  <!-- especie -->
  <text x="24" y="165" font-size="12" font-weight="bold" fill="#333">Especie *</text>
  <rect x="24" y="173" width="327" height="40" rx="6" fill="#ffffff" stroke="#bbb"/>
  <text x="36" y="197" font-size="11" fill="#aaa">Ej: Fresno, Jacarandá...</text>

  <!-- estado del ejemplar -->
  <text x="24" y="235" font-size="12" font-weight="bold" fill="#333">Estado del ejemplar *</text>
  <rect x="24" y="243" width="327" height="40" rx="6" fill="#ffffff" stroke="#bbb"/>
  <text x="36" y="267" font-size="11" fill="#555">Seleccionar... ▾</text>
  <text x="24" y="298" font-size="9" fill="#c0392b">⚠ Campo obligatorio</text>

  <!-- ubicación -->
  <text x="24" y="330" font-size="12" font-weight="bold" fill="#333">Ubicación</text>
  <rect x="24" y="338" width="327" height="90" rx="8" fill="#eef3f5" stroke="#bbb"/>
  <text x="187" y="388" font-size="10" fill="#888" text-anchor="middle">📍 Av. Pellegrini 2340</text>

  <!-- fotos -->
  <text x="24" y="452" font-size="12" font-weight="bold" fill="#333">Fotos del ejemplar</text>
  <rect x="24" y="460" width="70" height="70" rx="6" fill="#e8e8e8" stroke="#bbb"/>
  <text x="59" y="500" font-size="18" fill="#999" text-anchor="middle">📷</text>
  <rect x="102" y="460" width="70" height="70" rx="6" fill="#e8e8e8" stroke="#bbb"/>
  <text x="137" y="500" font-size="18" fill="#999" text-anchor="middle">🌳</text>
  <rect x="180" y="460" width="70" height="70" rx="6" fill="#ffffff" stroke="#bbb" stroke-dasharray="4"/>
  <text x="215" y="500" font-size="18" fill="#bbb" text-anchor="middle">+</text>

  <!-- ver dictamen anterior -->
  <rect x="24" y="555" width="327" height="36" rx="6" fill="#eaf2f8" stroke="#3498db"/>
  <text x="187" y="578" font-size="10" fill="#2874a6" text-anchor="middle">🕓 Ver dictamen anterior (Pendiente-revisión)</text>

  <!-- fixed bottom action -->
  <rect x="0" y="748" width="375" height="64" fill="#ffffff" stroke="#eee"/>
  <rect x="24" y="764" width="327" height="32" rx="8" fill="#2c3e50"/>
  <text x="187" y="785" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">SIGUIENTE</text>
</svg>
