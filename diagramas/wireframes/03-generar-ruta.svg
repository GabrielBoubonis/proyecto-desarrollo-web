<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="375" height="812" fill="#ffffff"/>
  <rect width="375" height="24" fill="#eeeeee"/>

  <rect x="0" y="24" width="375" height="56" fill="#2c3e50"/>
  <text x="48" y="58" font-size="16" fill="#ffffff" font-weight="bold">Generar ruta</text>
  <text x="20" y="58" font-size="16" fill="#ffffff">←</text>

  <!-- step indicator -->
  <circle cx="70" cy="105" r="12" fill="#2c3e50"/>
  <text x="70" y="109" font-size="11" fill="#fff" text-anchor="middle">1</text>
  <text x="70" y="130" font-size="9" fill="#2c3e50" text-anchor="middle">Criterios</text>
  <line x1="90" y1="105" x2="280" y2="105" stroke="#ccc" stroke-width="2"/>
  <circle cx="300" cy="105" r="12" fill="#ddd"/>
  <text x="300" y="109" font-size="11" fill="#777" text-anchor="middle">2</text>
  <text x="300" y="130" font-size="9" fill="#999" text-anchor="middle">Confirmar</text>

  <!-- distrito -->
  <text x="24" y="165" font-size="12" font-weight="bold" fill="#333">Distrito</text>
  <rect x="24" y="173" width="180" height="20" rx="10" fill="#ffffff" stroke="#bbb"/>
  <text x="34" y="187" font-size="10" fill="#555">Sin filtrar por distrito ▾</text>
  <text x="215" y="187" font-size="9" fill="#999">(opcional)</text>

  <!-- prioridad -->
  <text x="24" y="225" font-size="12" font-weight="bold" fill="#333">Cantidad por prioridad</text>
  <rect x="24" y="233" width="100" height="46" rx="8" fill="#fdecea" stroke="#e74c3c"/>
  <text x="74" y="253" font-size="9" fill="#c0392b" text-anchor="middle">Alta</text>
  <text x="74" y="270" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">3</text>
  <rect x="132" y="233" width="100" height="46" rx="8" fill="#fef5e7" stroke="#f39c12"/>
  <text x="182" y="253" font-size="9" fill="#c0790a" text-anchor="middle">Media</text>
  <text x="182" y="270" font-size="14" fill="#c0790a" text-anchor="middle" font-weight="bold">4</text>
  <rect x="240" y="233" width="100" height="46" rx="8" fill="#eafaf1" stroke="#27ae60"/>
  <text x="290" y="253" font-size="9" fill="#1e8449" text-anchor="middle">Baja</text>
  <text x="290" y="270" font-size="14" fill="#1e8449" text-anchor="middle" font-weight="bold">1</text>

  <!-- zona en mapa -->
  <text x="24" y="320" font-size="12" font-weight="bold" fill="#333">Zona en el mapa (opcional)</text>
  <rect x="24" y="330" width="327" height="180" rx="8" fill="#eef3f5" stroke="#bbb"/>
  <text x="187" y="415" font-size="11" fill="#888" text-anchor="middle">🗺  Tocar para dibujar una zona</text>
  <circle cx="150" cy="380" r="4" fill="#e74c3c"/>
  <circle cx="200" cy="400" r="4" fill="#e74c3c"/>
  <circle cx="230" cy="360" r="4" fill="#e74c3c"/>

  <!-- summary -->
  <rect x="24" y="530" width="327" height="40" rx="8" fill="#eaf2f8"/>
  <text x="187" y="554" font-size="11" fill="#2c3e50" text-anchor="middle">8 solicitudes cumplen estos criterios</text>

  <!-- primary button -->
  <rect x="24" y="590" width="327" height="48" rx="8" fill="#2c3e50"/>
  <text x="187" y="619" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">CONTINUAR</text>

  <!-- modal overlay preview (confirmación) -->
  <rect x="0" y="0" width="375" height="812" fill="#000000" opacity="0.35"/>
  <rect x="30" y="320" width="315" height="200" rx="12" fill="#ffffff"/>
  <text x="187" y="360" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Confirmar ruta</text>
  <text x="187" y="385" font-size="11" fill="#555" text-anchor="middle">Se reservarán 8 solicitudes</text>
  <text x="187" y="402" font-size="11" fill="#555" text-anchor="middle">para tu ruta de hoy.</text>
  <text x="187" y="424" font-size="9" fill="#888" text-anchor="middle">Ninguna estará disponible</text>
  <text x="187" y="438" font-size="9" fill="#888" text-anchor="middle">para otros ingenieros.</text>
  <rect x="50" y="460" width="120" height="40" rx="8" fill="#ffffff" stroke="#999"/>
  <text x="110" y="484" font-size="11" fill="#555" text-anchor="middle">Cancelar</text>
  <rect x="200" y="460" width="120" height="40" rx="8" fill="#2c3e50"/>
  <text x="260" y="484" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">Confirmar</text>
</svg>
